<style>
  /* Brand kit OAQ : bleu nuit #003D4C · bleu pétrole #00627A · aqua #00AEEF */
  :root{--teal:#00627A;--teal-d:#003D4C;--aqua:#00AEEF}
  body{margin:0;font:16px/1.5 'Open Sans',Verdana,sans-serif;
    background:linear-gradient(160deg,#003D4C,#00627A);min-height:100vh;
    display:flex;align-items:center;justify-content:center}
  .lock{background:#ffffff;border-radius:18px;padding:38px 34px;max-width:380px;width:92%;
    box-shadow:0 18px 60px rgba(0,0,0,.35);text-align:center}
  .lock h1{font-family:'Figtree',Verdana,sans-serif;font-size:19px;color:#003D4C;margin:0 0 4px}
  .lock h1 .kw{color:var(--aqua)}
  .lock p{color:#3d5a64;font-size:13.5px;margin:0 0 22px}
  .lock input{width:100%;box-sizing:border-box;padding:12px 14px;font-size:16px;border:1.5px solid #cfd8dc;
    border-radius:10px;text-align:center;letter-spacing:1px}
  .lock button{width:100%;margin-top:12px;padding:12px;font-size:15px;font-weight:700;color:#fff;
    background:var(--teal);border:none;border-radius:10px;cursor:pointer;font-family:'Figtree',Verdana,sans-serif}
  .lock button:hover{background:var(--teal-d)}
  .err{color:#c62828;font-size:13px;height:18px;margin-top:10px}
  .foot{margin-top:18px;font-size:11.5px;color:#7d8f96}
</style>
</head>

const SALT = "WxHXwVLC29ebwynKGVBElg==", IV = "wMNsuzk1Fotqx7d5", ITER = 200000;
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function unlock(){
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err"); err.textContent = "";
  try{
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"},
      km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const clear = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(PAYLOAD));
    const html = new TextDecoder().decode(clear);
    document.open(); document.write("<!DOCTYPE html><html lang=fr><head><meta charset=utf-8><meta name=viewport content='width=device-width, initial-scale=1'><meta name=robots content='noindex, nofollow'><title>OAQ — Plan stratégique 2026-2029</title></head><body>"+html+"</body></html>");
    document.close();
  }catch(e){ err.textContent = "Mot de passe incorrect."; }
}
