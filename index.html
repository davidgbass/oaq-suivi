<title>OAQ — Suivi du plan stratégique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Brand kit OAQ : bleu nuit #003D4C · bleu pétrole #00627A · aqua #00AEEF */
  :root{--teal:#00627A;--teal-d:#003D4C;--aqua:#00AEEF}
  body{margin:0;font:16px/1.5 'Open Sans',Verdana,sans-serif;
    background:linear-gradient(160deg,#003D4C,#00627A);min-height:100vh;
    display:flex;align-items:center;justify-content:center}
  .lock{background:#ffffff;border-radius:18px;padding:38px 34px;max-width:380px;width:92%;
    box-shadow:0 18px 60px rgba(0,0,0,.35);text-align:center}
  .lock h1{font-family:'Figtree',Verdana,sans-serif;font-size:19px;color:#003D4C;margin:0 0 4px}
  .lock h1 .kw{color:var(--aqua)}
  .lock p{color:#3d5a64;font-size:13.5px;margin:0 0 22px}
  .lock input{width:100%;box-sizing:border-box;padding:12px 14px;font-size:16px;border:1.5px solid #cfd8dc;
    border-radius:10px;text-align:center;letter-spacing:1px}
  .lock button{width:100%;margin-top:12px;padding:12px;font-size:15px;font-weight:700;color:#fff;
    background:var(--teal);border:none;border-radius:10px;cursor:pointer;font-family:'Figtree',Verdana,sans-serif}
  .lock button:hover{background:var(--teal-d)}
  .err{color:#c62828;font-size:13px;height:18px;margin-top:10px}
  .foot{margin-top:18px;font-size:11.5px;color:#7d8f96}
</style>
</head>

  }catch(e){ err.textContent = "Mot de passe incorrect."; }
}
document.getElementById("go").onclick = unlock;
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") unlock(); });
// Lien à déverrouillage automatique : mot de passe dans le fragment (#...), jamais
// envoyé au serveur ni indexé par les moteurs de recherche. Retiré de l'adresse
// affichée dès lecture pour ne pas traîner en clair dans l'historique du navigateur.
// Sur pageshow (pas seulement au chargement initial) pour couvrir aussi une page
// restaurée depuis le cache navigateur (retour arrière, etc.).
function tryAutoUnlock(){
  const pwEl = document.getElementById("pw");
  if(!pwEl || location.hash.length <= 1) return;
  pwEl.value = decodeURIComponent(location.hash.slice(1));
  history.replaceState(null, "", location.pathname + location.search);
  unlock();
}
tryAutoUnlock();
window.addEventListener("pageshow", tryAutoUnlock);
// Si l'onglet avait déjà cette page ouverte (sans mot de passe dans l'adresse),
// cliquer le lien complet ne change que le fragment sans recharger le document :
// ni "load" ni "pageshow" ne se redéclenchent, seulement "hashchange".
window.addEventListener("hashchange", tryAutoUnlock);
</script>
