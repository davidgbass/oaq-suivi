const SALT = "F8aeSbqn9nLberSkEHGOIA==", IV = "9lI1tTMPacyENK8d", ITER = 200000;
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function unlock(){
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err"); err.textContent = "";
  try{
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"},
      km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const clear = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(PAYLOAD));
    const html = new TextDecoder().decode(clear);
    document.open(); document.write("<!DOCTYPE html><html lang=fr><head><meta charset=utf-8><meta name=viewport content='width=device-width, initial-scale=1'><meta name=robots content='noindex, nofollow'><title>Carte des parties prenantes</title></head><body>"+html+"</body></html>");
    document.close();
  }catch(e){ err.textContent = "Mot de passe incorrect."; }
}
document.getElementById("go").onclick = unlock;
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") unlock(); });
// Lien à déverrouillage automatique (mot de passe dans le fragment), comme le dashboard :
// couvre le chargement initial, la restauration depuis le cache, et le simple
// changement de fragment quand l'onglet avait déjà la page ouverte.
function tryAutoUnlock(){
  const pwEl = document.getElementById("pw");
  if(!pwEl || location.hash.length <= 1) return;
  pwEl.value = decodeURIComponent(location.hash.slice(1));
  history.replaceState(null, "", location.pathname + location.search);
  unlock();
}
tryAutoUnlock();
window.addEventListener("pageshow", tryAutoUnlock);
window.addEventListener("hashchange", tryAutoUnlock);
</script>
